[project]
name = "svr"
version = "1.0.0"
description = "SVAR monétaire à la Christiano-Eichenbaum-Evans et SVAR budgétaire : le travail ECO8086 TP2 de 2021, rendu reproductible"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Guillaume Vaudescal" }]
dependencies = [
    "matplotlib>=3.9",
    "numpy>=2.0",
    "pandas>=2.2",
    "requests>=2.32",
    "statsmodels>=0.14",
    "typer>=0.12",
]

[project.scripts]
svr = "svr.cli:app"

[project.urls]
Homepage = "https://github.com/Guilou001/uqam-svar-monetaire-budgetaire"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/svr"]

[dependency-groups]
dev = ["pypdf>=5.0", "pytest>=8.0", "ruff>=0.6"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
